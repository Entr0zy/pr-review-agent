name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and cloud adapter deps
        run: pip install -e ".[dev,cloud]"
      - name: Run tests
        run: python -m pytest -q
      - name: Construct Google ADK GitLab MCP agent
        run: |
          python -c "from agents.gitlab_reviewer.agent import root_agent; assert root_agent.model == 'gemini-3.1-pro-preview'; print(root_agent.name)"
